<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <rect width="900" height="600" fill="#111111"/>
  
  <!-- Outer Ring -->
  <circle cx="450" cy="300" r="220" fill="none" stroke="#D52B1E" stroke-width="12"/>
  <circle cx="450" cy="300" r="200" fill="#181818" stroke="#E5A93C" stroke-width="6"/>
  
  <!-- Crosshairs / Reticle Lines -->
  <line x1="450" y1="110" x2="450" y2="490" stroke="#D52B1E" stroke-width="4" stroke-dasharray="16,8"/>
  <line x1="260" y1="300" x2="640" y2="300" stroke="#D52B1E" stroke-width="4" stroke-dasharray="16,8"/>
  
  <!-- Star / Cross Rays -->
  <polygon points="450,150 465,220 535,235 465,250 450,320 435,250 365,235 435,220" fill="#E5A93C" opacity="0.8"/>
  <polygon points="450,280 465,350 535,365 465,380 450,450 435,380 365,365 435,350" fill="#E5A93C" opacity="0.8"/>
  
  <!-- Inner Skull Emblem -->
  <g transform="translate(450, 300) scale(1.15)">
    <!-- Skull Base -->
    <path d="M -45,-50 C -70,-50 -75,-10 -65,20 C -55,45 -35,55 -30,75 L 30,75 C 35,55 55,45 65,20 C 75,-10 70,-50 45,-50 Z" fill="#F0F0F0" stroke="#222" stroke-width="3"/>
    <!-- Eye Sockets -->
    <path d="M -38,-10 C -45,-10 -48,15 -35,20 C -22,25 -20,-5 -38,-10 Z" fill="#111111"/>
    <path d="M 38,-10 C 45,-10 48,15 35,20 C 22,25 20,-5 38,-10 Z" fill="#111111"/>
    <!-- Nasal Cavity -->
    <polygon points="0,15 -8,35 8,35" fill="#111111"/>
    <!-- Teeth / Jaw Lines -->
    <line x1="-20" y1="60" x2="-20" y2="75" stroke="#111111" stroke-width="3"/>
    <line x1="-7" y1="60" x2="-7" y2="75" stroke="#111111" stroke-width="3"/>
    <line x1="7" y1="60" x2="7" y2="75" stroke="#111111" stroke-width="3"/>
    <line x1="20" y1="60" x2="20" y2="75" stroke="#111111" stroke-width="3"/>
  </g>
  
  <!-- Curved/Circular Text Paths or Centered Labels -->
  <text x="450" y="80" fill="#E5A93C" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" letter-spacing="6">ЧВК ВАГНЕР</text>
  <text x="450" y="550" fill="#E5A93C" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">ГРУППА ВАГНЕРА</text>
</svg>
